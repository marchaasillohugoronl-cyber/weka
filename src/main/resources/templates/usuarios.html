<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios – StreamFlix</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #1a1a2e; color: #eee; }
        h1 { color: #e94560; }
        nav a { color: #a8dadc; margin-right: 15px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th { background: #16213e; padding: 10px; text-align: left; border: 1px solid #333; }
        td { padding: 9px 10px; border: 1px solid #333; }
        tr:nth-child(even) { background: #162447; }
        .form-card { background: #16213e; border-radius: 10px; padding: 22px; margin-top: 28px; max-width: 500px; }
        .form-card h2 { color: #a8dadc; margin-top: 0; font-size: 1em; }
        label { display: block; color: #aaa; font-size: 0.82em; margin: 10px 0 3px; }
        input, select { width: 100%; padding: 8px 10px; border-radius: 5px; border: 1px solid #444;
                        background: #0f3460; color: #eee; font-size: 0.9em; box-sizing: border-box; }
        .btn { margin-top: 14px; padding: 9px 22px; background: #e94560; color: #fff;
               border: none; border-radius: 5px; cursor: pointer; font-size: 0.95em; }
        .del { color: #e94560; text-decoration: none; font-size: 0.85em; }
        .del:hover { text-decoration: underline; }
    </style>
</head>
<body>

<nav>
    <a href="/">Inicio</a>
    <a href="/usuarios" style="color:#e94560">Usuarios</a>
    <a href="/peliculas">Películas</a>
    <a href="/panel">Panel IA</a>
</nav>

<h1>Gestión de Usuarios</h1>

<table>
    <thead>
        <tr>
            <th>ID</th><th>Nombre</th><th>Edad</th><th>País</th><th>Géneros Favoritos</th><th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.edad}"></td>
            <td th:text="${u.pais}"></td>
            <td th:text="${u.generosFavoritos}"></td>
            <td>
                <a class="del" th:href="@{/usuarios/eliminar/{id}(id=${u.id})}"
                   onclick="return confirm('¿Eliminar usuario?')">Eliminar</a>
                &nbsp;|&nbsp;
                <a class="del" style="color:#a8dadc"
                   th:href="@{/recomendaciones/{id}(id=${u.id})}">Ver recomendaciones</a>
            </td>
        </tr>
    </tbody>
</table>

<div class="form-card">
    <h2>Agregar usuario</h2>
    <form action="/usuarios" method="post">
        <label>Nombre</label>
        <input type="text" name="nombre" required placeholder="Ej: Ana Gómez">
        <label>Edad</label>
        <input type="number" name="edad" min="1" max="120" placeholder="Ej: 28">
        <label>País</label>
        <input type="text" name="pais" placeholder="Ej: Perú">
        <label>Géneros favoritos (separados por coma)</label>
        <input type="text" name="generosFavoritos" placeholder="Ej: ACCION,TERROR">
        <button class="btn" type="submit">Guardar</button>
    </form>
</div>

</body>
</html>
